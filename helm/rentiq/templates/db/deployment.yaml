apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
    {{- include "rentiq.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.port }}
          envFrom:
            - secretRef:
                name: db-secret
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.user | quote }}]
            initialDelaySeconds: {{ .Values.db.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.db.probes.readiness.periodSeconds }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.user | quote }}]
            initialDelaySeconds: {{ .Values.db.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.db.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
      volumes:
        - name: db-data
          emptyDir: {}
