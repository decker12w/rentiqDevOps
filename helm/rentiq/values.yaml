# Ingress de entrada da aplicação (acessível em http://k8s.local)
ingress:
  enabled: true
  className: nginx
  host: k8s.local

# Banco de dados PostgreSQL
db:
  name: db
  image:
    repository: postgres
    tag: "16-alpine"
  user: postgres
  password: postgres
  database: am
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 10

# Backend (FastAPI + Uvicorn)
backend:
  name: backend
  image:
    repository: josemaia123/rentiq-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8000
  healthCheckPath: /health
  env:
    allowedOrigins: '["http://k8s.local"]'
    modelPath: "models/modelo_aluguel.pkl"
    stage: production
    debug: "false"
  jwtSecret: dev-secret-change-in-production
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 20

# Frontend (React + Nginx)
frontend:
  name: frontend
  image:
    repository: josemaia123/rentiq-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 80
  serviceName: frontend
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 20
